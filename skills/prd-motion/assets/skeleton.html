<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{제품명}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: {{도메인}} 현장의 {{시그니처 요소}} 문법. 기능마다 움직이는 장면 한 장 + 조작 패널 한 쌍.
   아래 토큰 값은 references/visual-worlds.md 절차로 PRD 도메인에 맞게 바꾼다. */
:root{
  --bg:#0b1016; --panel:#111923; --panel2:#172231; --line:rgba(170,195,230,.15);
  --ink:#eef2f7; --mute:#8d9aac;
  --sign:#ffc629; --sign-ink:#15120a;
  --flow:#3ed6b5; --warn:#ff9f40; --alert:#ff5a4f; --info:#5aa9ff;
  --f-d:'Gothic A1','IBM Plex Sans KR',system-ui,sans-serif;
  --f-b:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono','IBM Plex Sans KR',ui-monospace,Consolas,monospace;
  --nav:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.7;padding-inline:clamp(16px,4vw,40px);padding-block:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sign);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto}
canvas{display:block;width:100%;height:auto;max-width:100%}

.top{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) clamp(16px,4vw,40px) 0;display:flex;align-items:center;gap:16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.top nav a{color:var(--mute);text-decoration:none;font-size:13px;padding:6px 10px;border-radius:3px;white-space:nowrap}
.top nav a:hover{color:var(--ink);background:var(--panel2)}
@media (max-width:720px){.top nav a:not(.cta){display:none}}

section{padding-block:clamp(64px,10vw,120px);border-top:1px solid var(--line)}
.eyebrow{font-family:var(--f-m);font-size:12px;letter-spacing:.08em;color:var(--mute);margin:0 0 14px}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.12;text-wrap:balance}
h2{font-size:clamp(30px,4.6vw,54px);font-weight:900;margin-bottom:14px}
.lead{color:var(--mute);max-width:62ch;margin:0 0 32px}
.lead b{color:var(--ink);font-weight:500}
.ex{font-family:var(--f-m);font-size:10.5px;color:var(--mute);border:1px dashed var(--line);padding:1px 6px;border-radius:2px;white-space:nowrap}

/* 기능 라벨(시그니처 요소로 바꿔 쓴다) */
.sign{display:inline-flex;border-radius:3px;overflow:hidden;font-family:var(--f-m);font-weight:700;font-size:13px;margin-bottom:18px}
.sign b{background:var(--sign);color:var(--sign-ink);padding:4px 10px}
.sign span{background:var(--panel2);padding:4px 10px;font-weight:600}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--sign)}
.btn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-weight:600}
.btn[aria-pressed="true"]{border-color:var(--flow);color:var(--flow)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;font-family:var(--f-m);font-size:11px;font-weight:600;padding:2px 8px;border-radius:2px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--flow) 16%,transparent);color:var(--flow)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.alert{background:color-mix(in srgb,var(--alert) 18%,transparent);color:var(--alert)}
.pill.off{background:color-mix(in srgb,var(--mute) 16%,transparent);color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);margin:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--sign)}

/* 히어로 */
.hero{padding-top:calc(var(--nav) + clamp(48px,9vw,110px));padding-bottom:28px;border-top:0}
.hero h1{font-size:clamp(44px,8vw,104px);font-weight:900;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--sign)}
.hero .sub{color:var(--mute);font-size:clamp(16px,2vw,20px);max-width:46ch;margin:22px 0 32px}
.stage-wrap{position:relative}
.stage{position:sticky;top:calc(var(--nav) + env(safe-area-inset-top,0px) + 10px);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding-block:10px}
.stage .scene{position:relative;overflow:hidden}
.phase{position:absolute;left:14px;top:12px;font-family:var(--f-m);font-size:12px;font-weight:700;padding:4px 10px;border-radius:2px;background:var(--alert);color:#fff;transition:background .4s}
.phase.mid{background:var(--sign);color:var(--sign-ink)}
.phase.after{background:var(--flow);color:#06201a}
.board{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.board table{width:100%;border-collapse:collapse;font-family:var(--f-m);font-size:13px;font-variant-numeric:tabular-nums}
.board th{font-weight:400;color:var(--mute);font-size:11px;text-align:left;padding:4px 0;border-bottom:1px solid var(--line)}
.board td{padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

/* 기능 섹션: 장면 + 조작 패널 */
.feat{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.feat>*{min-width:0}
.side{padding:18px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.feat{grid-template-columns:minmax(0,1fr)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;z-index:40;background:var(--sign);color:var(--sign-ink);font-weight:600;padding:10px 18px;border-radius:3px;pointer-events:none;transition:.3s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}}
</style>

<header class="top">
  <b>{{제품 약칭}}</b>
  <nav aria-label="섹션"><a href="#hero">흐름</a><!-- 기능마다 <a href="#fr01">FR-01</a> --></nav>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">PRD · {{제품명}}</p>
    <h1>{{핵심 가치 문장 앞부분}}<br><em>{{강조할 단어}}</em></h1>
    <p class="sub">{{핵심 가치 한 문장}} 아래 장면을 스크롤하면 Before에서 After로 바뀝니다.</p>
  </section>

  <div class="stage-wrap" id="hero">
    <div class="stage" id="stage">
      <div class="panel scene"><canvas id="heroCanvas" width="1000" height="560" aria-label="{{장면 설명}}"></canvas><span class="phase" id="phase">BEFORE</span></div>
      <div class="panel board">
        <!-- 장면과 같은 숫자를 HTML로: 좁은 화면에서도 읽히게 -->
        <table><thead><tr><th>{{대상}}</th><th>{{양}}</th><th>상태</th></tr></thead><tbody id="heroRows"></tbody></table>
        <div class="ctrl"><button class="btn primary" type="button" id="heroPlay">재생</button><button class="btn" type="button" id="heroReset">처음으로</button></div>
        <div class="ctrl"><input type="range" id="heroRange" min="0" max="1000" value="0" aria-label="Before에서 After까지 진행"></div>
        <p class="note">{{점 하나의 의미와 수치 출처}}</p>
      </div>
    </div>
  </div>

  <!-- 기능 섹션 반복 -->
  <section id="fr01" aria-labelledby="fr01-h">
    <div class="sign"><b>FR-01</b><span>{{사용 화면}}</span></div>
    <h2 id="fr01-h">{{이 기능이 바꾸는 것을 한 문장으로}}</h2>
    <p class="lead">{{PRD 설명}} <b>{{무엇을 조작해 보라는 안내}}</b></p>
    <div class="feat">
      <div class="panel scene"><canvas id="fr01Canvas" width="1000" height="470" aria-label="{{장면 설명}}"></canvas></div>
      <div class="panel side"><!-- 조작 요소 + 결과 readout --></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* 1) assets/motion-kit.js 내용을 여기에 그대로 붙인다 */

/* 2) 공유 상태. 값은 처음부터 '모두 동작하는 상태'로 채워 둔다(첫 화면이 완성 상태로 읽히게).
   구독은 의존 순서대로 push한다: FR-01 → FR-02 → … 앞 기능이 계산한 값을 뒤 기능이 읽는다. */
var S=MK.store({/* 기능끼리 공유하는 값 */});

/* 3) 히어로 */
(function(){
  var cv=MK.$('#heroCanvas'),ctx=cv.getContext('2d'),st=MK.fitCanvas(cv,1000,560),target=0,p=0;
  MK.scrubber({wrap:MK.$('#hero'),stage:MK.$('#stage'),range:MK.$('#heroRange'),play:MK.$('#heroPlay'),reset:MK.$('#heroReset'),onP:function(v){target=v}});
  MK.runWhenVisible(cv,function(time,dt){
    p+=(target-p)*(MK.reduce?1:.12);
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(st.k,0,0,st.k,0,0);
    /* p로 장면 그리기 (archetypes.md 참고), 보드 숫자 갱신 */
  });
})();

/* 4) 기능 모듈: 기능마다 IIFE 하나. 입력이 바뀌면 S를 고치고 S.emit().
   모듈 안에서는 render(파생값 계산 + DOM 갱신)를 S.subs에 넣기만 하고, 첫 실행은 맨 아래 S.emit() 한 번에 맡긴다.
   render 안에서 다시 S.emit()을 부르면 무한 반복이 된다. 꼭 필요하면 값이 실제로 바뀐 경우에만 setTimeout(S.emit,0). */

S.emit();
</script>
